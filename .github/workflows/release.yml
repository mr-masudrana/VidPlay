name: Release APK

# v1.1 এর মতো ট্যাগ push করলে সাইনড রিলিজ APK + checksums.txt সহ GitHub Release তৈরি হবে।
# দরকারি Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 সেট নেই — আনসাইনড APK বানানো হবে"
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Prepare files
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/tubex.apk
          (cd out && sha256sum tubex.apk > checksums.txt)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/tubex.apk
            out/checksums.txt
